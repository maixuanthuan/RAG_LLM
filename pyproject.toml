[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-ai-assistant"
version = "0.1.0"
description = "Trợ lý AI nội bộ chạy local: Local LLM + RAG trên tài liệu công ty"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.40",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assistant = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
