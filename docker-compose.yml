services:
  api:
    build: .
    env_file: .env
    environment:
      # Ghi đè địa chỉ LLM: trong container, localhost không phải máy host
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Tuỳ chọn: chạy Ollama trong container (cần nvidia-container-toolkit)
  # docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Tuỳ chọn: Qdrant dạng server (không bị khoá thư mục như chế độ nhúng).
  # docker compose --profile qdrant up -d qdrant   rồi đặt QDRANT_URL=http://localhost:6333
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"  # chỉ máy này truy cập được
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  ollama_data:
  qdrant_data:
